[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-audio-analysis-dedupe"
version = "0.1.0"
description = "Offline audio analysis and duplicate detection for DJ libraries"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
shadow-audio-dedupe = "shadow_audio_dedupe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
